name: Deploy GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment configuration
        run: |
          test -n "$VITE_BASE_PATH" || { echo 'Set VITE_BASE_PATH in repository variables'; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo 'Set VITE_SUPABASE_URL in repository variables'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Set the public Supabase key in repository variables'; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the build holds no personal exports or credentials
        run: node scripts/check-public-safety.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm the hosted project refuses anonymous access
        run: node scripts/probe-anonymous-access.mjs
