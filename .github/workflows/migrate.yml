name: Database migrations
# Applies new files in supabase/migrations to the Supabase project with the Supabase CLI.
# Runs when migrations change on main, or manually (Actions > Database migrations > Run workflow).
# The CLI records applied versions in supabase_migrations.schema_migrations and only runs new ones,
# each file in its own transaction. Requires repository secrets SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD; the project ref is read from the VITE_SUPABASE_URL variable.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/migrate.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list the migrations that would be applied'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: database-migrations
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Supabase account > Access Tokens).'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo '::error::Add the SUPABASE_DB_PASSWORD repository secret (the project database password).'; exit 1; }
          ref="$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]{20})\.supabase\.co/?$#\1#p')"
          test -n "$ref" || { echo '::error::Set the VITE_SUPABASE_URL repository variable to https://<project-ref>.supabase.co'; exit 1; }
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
      # Prove the migrations against embedded PostgreSQL before touching the real database.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/access.test.ts tests/import-database.test.ts
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Migrations before
        run: supabase migration list --linked
      - name: Apply new migrations
        run: supabase db push --linked --yes ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Migrations after
        run: supabase migration list --linked
